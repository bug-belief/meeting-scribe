name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # 门禁：零依赖，最快出结果。这两道拦的是「不会让任何测试失败」的问题 ——
  # 个人绝对路径、真实姓名/账号/内网 IP。跑得快所以放第一个。
  # ---------------------------------------------------------------------------
  gates:
    name: 门禁（路径 / 脱敏）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 路径与格式
        run: bash tools/check-style.sh

      - name: 脱敏
        run: python3 tools/sanitize-check.py

      # 门禁自己也要有测试：否则「永远通过」的门禁比没有更糟
      - name: 门禁自身的测试
        run: |
          python3 tests/test_path_gate.py
          python3 tests/test_sanitize_check.py

  # ---------------------------------------------------------------------------
  # 全量测试：只装基础依赖（不含 torch/funasr）。
  # 这恰好是「陌生人环境」——如果测试在这套环境里也要过，说明降级路径是通的。
  # ---------------------------------------------------------------------------
  tests:
    name: 全量测试（无本地模型）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 系统依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1

      - name: Python 依赖（只装基础包）
        run: pip install -r requirements.txt

      - name: 跑全量
        run: python tests/run_all.py
